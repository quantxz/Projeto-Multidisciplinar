services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: projeto-api

    ports:
      - "5207:5207"

    environment:
      DB_SERVER: {DB_SERVER}
      DB_NAME: {DB_NAME}
      DB_USER: {DB_USER}
      DB_PASSWORD: {DB_PASSWORD}
      JWT_KEY: {JWT_KEY}
      JWT_ISSUER: {ProjetoMultidisciplinarAAAAAAAAAAAAA}
      JWT_AUDIENCE: {ProjetoMultidisciplinarAAAAAAAAAAAAAAA}

    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4

    container_name: projeto-mysql

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ProjetoMultidisciplinar

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  mysql_data: