        id="tokenInput"

</main>

<script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@latest/dist/browser/signalr.min.js"></script>

<script>

    // ==========================================
    // ELEMENTOS
    // ==========================================

    const tokenInput =
        document.getElementById("tokenInput");

    const connectButton =
        document.getElementById("connectButton");

    const status =
        document.getElementById("status");

    const conversationInput =
        document.getElementById("conversationInput");

    const messageInput =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const historyButton =
        document.getElementById("historyButton");

    const messagesList =
        document.getElementById("messagesList");


    // ==========================================
    // CONEXÃO
    // ==========================================

    let connection = null;


    // ==========================================
    // ADICIONAR MENSAGEM
    // ==========================================

    function adicionarMensagem(mensagem) {

        console.log(
            "Mensagem recebida:",
            mensagem
        );


        const li =
            document.createElement("li");


        const author =
            document.createElement("div");

        author.className =
            "message-author";

        author.textContent =
            "Autor: " + mensagem.authorId;


        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            mensagem.content;


        const time =
            document.createElement("div");

        time.className =
            "message-time";


        const date =
            new Date(mensagem.sentAt);


        time.textContent =
            date.toLocaleString("pt-BR");


        li.appendChild(author);
        li.appendChild(content);
        li.appendChild(time);

        messagesList.appendChild(li);
    }


    // ==========================================
    // CONECTAR
    // ==========================================

    connectButton.addEventListener(
        "click",
        async () => {

            const token =
                tokenInput.value.trim();


            if (!token) {

                alert(
                    "Cole um token JWT primeiro."
                );

                return;
            }


            // Evita criar várias conexões

            if (
                connection &&
                connection.state ===
                    signalR.HubConnectionState.Connected
            ) {

                alert(
                    "Já existe uma conexão."
                );

                return;
            }


            connection =
                new signalR.HubConnectionBuilder()

                    .withUrl(
                        "http://localhost:5207/eventHub",
                        {
                            accessTokenFactory: () =>
                                token
                        }
                    )

                    .configureLogging(
                        signalR.LogLevel.Information
                    )

                    .build();


            // ==================================
            // RECEBER MENSAGEM
            // ==================================

            connection.on(
                "ReceiveMessage",
                (mensagem) => {

                    adicionarMensagem(
                        mensagem
                    );

                }
            );


            // ==================================
            // INICIAR
            // ==================================

            try {

                await connection.start();

                console.log(
                    "SignalR conectado!"
                );

                status.textContent =
                    "Conectado";

            } catch (error) {

                console.error(
                    "Erro ao conectar:",
                    error
                );

                status.textContent =
                    "Erro ao conectar";

            }

        }
    );


    // ==========================================
    // ENVIAR MENSAGEM
    // ==========================================

    sendButton.addEventListener(
        "click",
        async () => {

            const conversationID =
                conversationInput.value.trim();

            const message =
                messageInput.value.trim();


            if (!connection ||
                connection.state !==
                    signalR.HubConnectionState.Connected) {

                alert(
                    "Conecte-se primeiro."
                );

                return;
            }


            if (!conversationID) {

                alert(
                    "Informe o ID da conversa."
                );

                return;
            }


            if (!message) {

                return;
            }


            try {

                await connection.invoke(
                    "SendMessage",
                    conversationID,
                    message
                );


                messageInput.value = "";


            } catch (error) {

                console.error(
                    "Erro ao enviar mensagem:",
                    error
                );

            }

        }
    );


    // ==========================================
    // HISTÓRICO
    // ==========================================

    historyButton.addEventListener(
        "click",
        async () => {

            const conversationID =
                conversationInput.value.trim();

            const token =
                tokenInput.value.trim();


            if (!token) {

                alert(
                    "Informe o token JWT."
                );

                return;
            }


            if (!conversationID) {

                alert(
                    "Informe o ID da conversa."
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `http://localhost:5207/conversation/${conversationID}/messages`,
                        {
                            method: "GET",

                            headers: {
                                "Authorization":
                                    `Bearer ${token}`
                            }
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        `HTTP ${response.status}`
                    );

                }


                const messages =
                    await response.json();


                messagesList.innerHTML =
                    "";


                messages.forEach(
                    mensagem => {

                        adicionarMensagem(
                            mensagem
                        );

                    }
                );


            } catch (error) {

                console.error(
                    "Erro ao carregar histórico:",
                    error
                );

            }

        }
    );


    // ==========================================
    // ENTER PARA ENVIAR
    // ==========================================

    messageInput.addEventListener(
        "keydown",
        (event) => {

            if (event.key === "Enter") {

                sendButton.click();

            }

        }
    );

</script>

</body>

</html>
